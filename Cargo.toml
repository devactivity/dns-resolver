[package]
name = "dns-resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["cargo", "derive"] }
owo-colors = "4.4.0"
rand = "0.10.2"
thiserror = "2.0.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[[bin]]
name = "resolver"
path = "src/main.rs"
